name: Benchmark results
# Rebuilds benchmark/results.json from the graded runs on every push, so the
# table on aurorasre.ai/benchmark and the raw JSON always match the repo.
on:
  push:
    branches: [main]
    paths: ['runs/**', 'scenarios/**', 'runner/benchmark_export.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 runner/benchmark_export.py --site /nonexistent
      - name: Commit if changed
        run: |
          git config user.name "aurora-lab-bot"; git config user.email "bot@users.noreply.github.com"
          git add benchmark/results.json
          git diff --cached --quiet || { git commit -m "benchmark: refresh results.json"; git push; }
