# 20 one-shot pods, each allocates 150 MiB under a 128Mi limit and is OOM killed once.
# Used to count how often the kubelet reports reason OOMKilled vs Error.
---
apiVersion: v1
kind: Pod
metadata: {name: tally-01, namespace: oom, labels: {app: tally}}
spec:
  restartPolicy: Never
  nodeSelector: {kubernetes.io/hostname: room-worker}
  containers:
  - name: tally
    image: python:3.12-alpine
    command: ["python", "-u", "-c", "b = b'\\x01' * (150 << 20); print('allocated')"]
    resources:
      requests: {memory: 128Mi, cpu: 10m}
      limits: {memory: 128Mi}
---
