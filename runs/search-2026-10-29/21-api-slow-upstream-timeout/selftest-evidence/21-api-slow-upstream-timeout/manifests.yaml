  data:
    default.conf: |
      upstream api {
          server api:8080;
      }
      server {
          listen 80;
          location /healthz { return 200 "ok\n"; }
          location /api/ {
              proxy_pass http://api/;
              proxy_connect_timeout 2s;
          }
          location / { return 200 "shop frontend\n"; }
      }
