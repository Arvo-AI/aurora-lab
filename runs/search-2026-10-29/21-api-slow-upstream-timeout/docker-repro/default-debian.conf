log_format timing '$remote_addr [$time_local] "$request" $status '
                  'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time us=$upstream_status ua=$upstream_addr';
upstream slowapp   { server r504-up:8080; }
upstream deadhost  { server 192.0.2.10:8080; }
upstream pair { server r504-up:8080; server r504-up2:8080; }
upstream closedport { server r504-up:9999; }
server {
    listen 80;
    access_log /dev/stdout timing;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    location /app/    { proxy_pass http://slowapp/; }
    location /dead/   { proxy_pass http://deadhost/; }
    location /pair/ { proxy_pass http://pair/; }
    location /closed/ { proxy_pass http://closedport/; }
}
