# kube-prometheus-stack 92.15.0 defaults, except: no Grafana, and the default
# Alertmanager receiver posts to an in-cluster webhook logger instead of 'null'
# so every notification that would have paged someone is recorded.
grafana:
  enabled: false
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'pager'
      routes:
      - receiver: 'null'
        matchers: ['alertname = "Watchdog"']
    receivers:
    - name: 'null'
    - name: 'pager'
      webhook_configs:
      - url: 'http://pager-log.monitoring.svc:8080/'
        send_resolved: true
    templates:
    - '/etc/alertmanager/config/*.tmpl'
