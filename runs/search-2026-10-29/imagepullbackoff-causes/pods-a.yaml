apiVersion: v1
kind: Namespace
metadata: {name: pulltest}
---
apiVersion: v1
kind: Pod
metadata: {name: repo-missing, namespace: pulltest}
spec:
  nodeName: rpull-worker2
  containers: [{name: app, image: "docker.io/rpullnoorg7f3k/app:1.0", command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: private-http, namespace: pulltest}
spec:
  nodeName: rpull-worker2
  containers: [{name: app, image: "rpull-registry:5000/private/busybox:1.37", command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: bad-host, namespace: pulltest}
spec:
  nodeName: rpull-worker2
  containers: [{name: app, image: "registry.rpull-nonexistent.example/app:1.0", command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: invalid-name, namespace: pulltest}
spec:
  nodeName: rpull-worker2
  containers: [{name: app, image: "Nginx:1.27-alpine"}]
---
apiVersion: v1
kind: Pod
metadata: {name: never-pull, namespace: pulltest}
spec:
  nodeName: rpull-worker2
  containers: [{name: app, image: "busybox:1.36.1", imagePullPolicy: Never, command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: init-bad-tag, namespace: pulltest}
spec:
  nodeName: rpull-worker2
  initContainers: [{name: wait, image: "busybox:1.37-typo", command: ["true"]}]
  containers: [{name: app, image: "nginx:1.27-alpine"}]
