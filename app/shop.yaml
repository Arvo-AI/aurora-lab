# Baseline "shop" app. Every scenario starts from this healthy state and breaks
# exactly one thing. Names and labels are neutral on purpose: nothing in the
# cluster may hint at which fault was injected.
#
#   loadgen -> frontend (nginx) -> api (python) -> redis
#                                  worker (python, batch jobs, no redis)
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-code
  namespace: shop
data:
  api.py: |
    import json, os, socket, sys, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    REDIS_HOST = os.environ["REDIS_HOST"]
    PORT = int(os.environ.get("PORT", "8080"))

    def redis_ping():
        with socket.create_connection((REDIS_HOST, 6379), timeout=2) as s:
            s.sendall(b"PING\r\n")
            return s.recv(64).startswith(b"+PONG")

    for attempt in range(1, 6):
        try:
            redis_ping()
            print(f"connected to redis at {REDIS_HOST}:6379", flush=True)
            break
        except OSError as e:
            print(f"redis connection failed (attempt {attempt}/5): {e}", flush=True)
            time.sleep(2)
    else:
        print("giving up: redis unavailable", flush=True)
        sys.exit(1)

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                return self._send(200, {"status": "ok"})
            try:
                redis_ping()
                self._send(200, {"items": ["kettle", "mug", "teapot"]})
            except OSError as e:
                print(f"request failed: redis error: {e}", flush=True)
                self._send(503, {"error": "backend unavailable"})

        def _send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def log_message(self, fmt, *args):
            print("%s %s" % (self.address_string(), fmt % args), flush=True)

    print(f"api listening on :{PORT}", flush=True)
    ThreadingHTTPServer(("", PORT), H).serve_forever()
  worker.py: |
    import os, time
    batch = int(os.environ.get("BATCH_SIZE", "500"))
    print(f"worker started, batch size {batch}", flush=True)
    while True:
        # Each queued item holds about 100 KiB while the batch is processed.
        buf = [bytearray(100 * 1024) for _ in range(batch)]
        print(f"processed batch of {len(buf)} items", flush=True)
        del buf
        time.sleep(5)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: shop
data:
  default.conf: |
    upstream api {
        server api:8080;
    }
    server {
        listen 80;
        location /healthz { return 200 "ok\n"; }
        location /api/ {
            proxy_pass http://api/;
            proxy_connect_timeout 2s;
        }
        location / { return 200 "shop frontend\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shop
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-u", "/code/api.py"]
          env:
            - {name: REDIS_HOST, value: redis}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts: [{name: code, mountPath: /code}]
      volumes:
        - name: code
          configMap: {name: api-code}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
spec:
  selector: {app: api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: python:3.12-alpine
          command: ["python", "-u", "/code/worker.py"]
          env:
            - {name: BATCH_SIZE, value: "500"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 192Mi}
          volumeMounts: [{name: code, mountPath: /code}]
      volumes:
        - name: code
          configMap: {name: api-code}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
      volumes:
        - name: conf
          configMap: {name: frontend-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: loadgen
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              while true; do
                code=$(wget -q -S -O /dev/null -T 3 http://frontend/api/items 2>&1 | awk '/^  HTTP\//{print $2}' | tail -1)
                echo "$(date -u +%FT%TZ) GET /api/items -> ${code:-timeout}"
                sleep 2
              done
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {memory: 32Mi}
