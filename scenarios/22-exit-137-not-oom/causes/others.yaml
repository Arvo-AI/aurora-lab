apiVersion: v1
kind: Pod
metadata: {name: plain-exit, namespace: exit137}
spec:
  nodeSelector: {kubernetes.io/hostname: aurora-lab-worker}
  containers:
  - name: app
    image: busybox:1.37
    # No signal at all: the program just returns 137, as wrappers that pass on a child's status do.
    command: ["sh", "-c", "echo up; sleep 5; exit 137"]
    resources:
      requests: {memory: 32Mi, cpu: 10m}
      limits: {memory: 64Mi}
---
