apiVersion: v1
kind: ConfigMap
metadata: {name: inner-conf, namespace: r503}
data:
  default.conf: |
    server {
        listen 8080;
        server_tokens off;
        location = /healthz { return 200 "ok\n"; }
        location / { return 503; }
    }
---
apiVersion: apps/v1
kind: Deployment
