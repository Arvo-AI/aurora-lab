    matchLabels: {app: inner}
  template:
    metadata:
      labels: {app: inner}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
      volumes:
        - name: conf
          configMap: {name: inner-conf}
---
apiVersion: v1
