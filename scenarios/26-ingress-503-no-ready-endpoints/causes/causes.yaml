apiVersion: v1
kind: Namespace
metadata: {name: r503}
---
apiVersion: v1
kind: Pod
metadata: {name: curl, namespace: r503}
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sleep", "86400"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: r503}
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "/code/backend.py"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          volumeMounts: [{name: code, mountPath: /code}]
      volumes:
        - name: code
          configMap: {name: backend-code}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: r503}
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
