id: 26-ingress-503-no-ready-endpoints
title: ingress-nginx returns 503 Service Temporarily Unavailable because a readiness probe that calls redis took every api pod out of the Service during a redis outage
alert: "HighErrorRate [critical] namespace=shop ingress=shop: requests through the ingress controller to /items are failing with 503 over the last 5 minutes (threshold 5%). The api pods are Running with 0 restarts."
change: >
  The api Deployment's readinessProbe was changed from /healthz to /items, which
  pings redis on every call. redis was then scaled to 0, standing in for a redis
  outage. ingress-nginx v1.15.1 routes /items to the api Service.
root_cause: >
  /items returns the app's own 503 while redis is down, so the kubelet marks both
  api pods NotReady after three failed probes and removes them from the Service.
  The api Service has no ready endpoints, so ingress-nginx has no upstream address
  and answers 503 Service Temporarily Unavailable itself, without contacting any
  pod: the access log shows an empty upstream address and no upstream status, and
  the controller logs that the Service does not have any active Endpoint. The stock
  nginx in the frontend pods proxies to the ClusterIP, so the same fault reaches it
  as Connection refused and a 502.
must_identify:
  - The 503 is generated by ingress-nginx, not by the api, because the Service has no ready endpoints and no upstream was contacted
  - The api pods are NotReady because their readiness probe calls /items, which depends on redis, and redis is down
acceptable_fixes:
  - Restore redis, and point the readiness probe back at /healthz so that a redis failure does not remove every pod from the Service
wrong_answers:
  - Restarting the ingress controller or the api pods as the fix
  - Service selector or targetPort as the cause
  - Rate limiting as the cause
  - The api application sending the 503 that clients see through the ingress
